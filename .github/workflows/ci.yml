name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  list:
    name: list verify steps
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Use Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: '.nvmrc'
      - id: list
        run: echo "names=$(node scripts/verify.mts --list)" >> "$GITHUB_OUTPUT"
  ci:
    needs: list
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.list.outputs.names) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: ${{ matrix.name }}
        run: yarn verify:${{ matrix.name }}
